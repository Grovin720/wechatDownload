name: Build & Auto Release wechatDownload 5.0
run-name: Build and Release from main branch

on:
  push:
    branches: [ main ] # main分支提交代码就触发打包发布
  workflow_dispatch: # 手动点击触发打包发布

permissions:
  contents: write # 必须，用于创建Release

jobs:
  build-release:
    runs-on: windows-latest
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - name: Checkout source main branch
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set npm mirror
        run: |
          npm config set registry shturl.cc/TfWPPPUY2II2PC722OYS
          npm config set electron_mirror https://npmmirror.com/mirrors/electron/

      - name: Install dependencies
        run: npm ci

      - name: Build Electron Windows package
        run: npm run build

      - name: Create Release & Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          generate_release_notes: true
          draft: true # ✅ 测试阶段：草稿Release，不会公开。打包成功人工确认后再Publish
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
