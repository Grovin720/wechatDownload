name: Build & Auto Release wechatDownload 5.0
run-name: Build and Release from main branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - name: Checkout source main branch
        uses: actions/checkout@v4

      # 修改点1：去掉cache，换更稳的setup-node写法
      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 删掉 cache: 'npm'，Windows下容易引发报错

      - name: Set npm mirror
        run: |
          npm config set registry shturl.cc/3i03R9AUBswQzjMkbeBZ
          npm config set electron_mirror https://npmmirror.com/mirrors/electron/

      - name: Install dependencies
        run: npm ci

      - name: Build Electron Windows package
        run: npm run build

      - name: Create Release & Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          generate_release_notes: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
