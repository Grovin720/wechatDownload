name: Build & Auto Release wechatDownload 5.0
run-name: Build and Release from main branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      NPM_CONFIG_REGISTRY: shturl.cc/lwtitO0HkRq64EYU7xlZ
    steps:
      - name: Checkout source main branch
        uses: actions/checkout@v4

      - name: Setup Node.js 20.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0

      # 改用环境变量设置镜像，不再单独run执行npm config，规避powershell执行失败问题
      - name: Install dependencies
        run: npm ci

      - name: Build Electron Windows package
        run: npm run build

      - name: Create Release & Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          generate_release_notes: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
